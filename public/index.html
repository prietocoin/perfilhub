<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PerfilHub Engine - Directorio de Socios</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2306b6d4'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070e23; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
  </style>
</head>

<body class="bg-[#030611] text-slate-100 min-h-screen p-4 md:p-6" x-data="perfilHubApp()" x-init="init()" x-cloak>
  
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- ENCABEZADO Y CONTROLES GLOBALES -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800/80 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>Directorio de Socios</span>
          <span class="text-xs font-mono px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">PERFILHUB</span>
        </h1>
        <p class="text-xs text-slate-400 font-mono mt-0.5" x-text="`Total: ${socios.length} socios registrados`"></p>
      </div>

      <!-- BOTONES DE ACCIÓN SUPERIOR -->
      <div class="flex flex-wrap items-center gap-2">
        <button @click="cargarSocios()" class="px-3 py-1.5 rounded-lg border border-amber-500/40 bg-amber-500/10 text-amber-400 text-xs font-semibold hover:bg-amber-500/20 transition flex items-center gap-1.5">
          🌐 General
        </button>
        <button @click="apagarTodos()" class="px-3 py-1.5 rounded-lg border border-rose-500/40 bg-rose-500/10 text-rose-400 text-xs font-semibold hover:bg-rose-500/20 transition flex items-center gap-1.5">
          🔴 Apagar Todos
        </button>
        <button @click="guardarPlantilla()" class="px-3 py-1.5 rounded-lg border border-purple-500/40 bg-purple-600/20 text-purple-300 text-xs font-semibold hover:bg-purple-600/30 transition flex items-center gap-1.5">
          📌 Guardar
        </button>
        <button @click="restaurarPlantilla()" class="px-3 py-1.5 rounded-lg border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 text-xs font-semibold hover:bg-emerald-500/20 transition flex items-center gap-1.5">
          📄 Restaurar
        </button>
        <button @click="abrirNuevoSocio()" class="px-3.5 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold transition flex items-center gap-1">
          + Nuevo
        </button>
      </div>
    </header>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="relative">
      <input 
        type="text" 
        x-model="busqueda" 
        placeholder="Buscar socio..." 
        class="w-full bg-[#070e23] border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500/60 focus:ring-1 focus:ring-cyan-500/40 transition">
    </div>

    <!-- LISTADO DE SOCIOS -->
    <div class="space-y-2.5">
      <template x-for="socio in sociosFiltrados" :key="socio.nombre">
        <div class="bg-[#070e23] border border-slate-800/90 hover:border-slate-700/80 rounded-xl p-3 md:p-4 flex flex-col md:flex-row md:items-center justify-between gap-4 transition shadow-sm">
          
          <!-- DATOS DEL SOCIO -->
          <div class="flex flex-wrap items-center gap-3">
            <span class="text-base font-bold text-white tracking-wide" x-text="socio.nombre"></span>

            <!-- BADGE WA -->
            <span 
              :class="(socio.mostrar?.tasas) ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'"
              class="text-[11px] font-semibold px-2 py-0.5 rounded-md border flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full" :class="(socio.mostrar?.tasas) ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'"></span>
              <span x-text="(socio.mostrar?.tasas) ? 'WA: Activo' : 'WA: Inactivo'"></span>
            </span>

            <!-- BADGE HERENCIA -->
            <span 
              :class="socio.herencia ? 'bg-purple-500/10 text-purple-300 border-purple-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'"
              class="text-[11px] font-semibold px-2 py-0.5 rounded-md border">
              <span x-text="socio.herencia ? '🔗 HERENCIA: ON' : '⚡ HERENCIA: OFF'"></span>
            </span>

            <!-- BADGES DE MONEDA Y ROL -->
            <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20" x-text="socio.rol || 'SOCIO'"></span>
            <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20" x-text="socio.moneda_base || 'USDT'"></span>

            <!-- JID DE WHATSAPP -->
            <span class="text-xs text-slate-400 font-mono" x-text="socio.id_grupo || 'Sin JID configurado'"></span>
          </div>

          <!-- BOTONES DE ACCIÓN INDIVIDUAL -->
          <div class="flex items-center gap-2 self-end md:self-auto">
            <!-- TOGGLE RÁPIDO DE TASAS -->
            <button 
              @click="toggleEstado(socio)" 
              :class="(socio.mostrar?.tasas) ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-slate-800 text-slate-500 border-slate-700'"
              class="p-2 rounded-lg border hover:scale-105 transition" 
              title="Activar/Desactivar Tasas">
              ⚡
            </button>

            <!-- ABRIR MODAL CONFIGURACIÓN -->
            <button 
              @click="abrirConfiguracion(socio)" 
              class="px-3 py-1.5 rounded-lg border border-purple-500/40 bg-purple-600/20 text-purple-200 text-xs font-semibold hover:bg-purple-600/30 transition flex items-center gap-1.5">
              ⚙ Configurar
            </button>

            <!-- ELIMINAR SOCIO -->
            <button 
              @click="eliminarSocio(socio)" 
              class="p-2 rounded-lg border border-rose-500/40 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 transition" 
              title="Eliminar socio">
              🗑
            </button>
          </div>
        </div>
      </template>

      <!-- EMPTY STATE -->
      <div x-show="sociosFiltrados.length === 0" class="text-center py-12 text-slate-500 text-sm">
        No se encontraron socios que coincidan con la búsqueda.
      </div>
    </div>

    <!-- MODAL DE CONFIGURACIÓN DE REGLAS Y MONEDAS -->
    <div x-show="modalConfigAbierto" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 overflow-y-auto" x-cloak>
      <div @click.outside="modalConfigAbierto = false" class="bg-[#070e23] border border-cyan-500/40 rounded-xl w-full max-w-4xl p-5 md:p-6 space-y-6 shadow-2xl">
        
        <h2 class="text-lg font-bold text-white flex items-center justify-between border-b border-slate-800 pb-3">
          <span>Configuración de Socio: <span class="text-cyan-400" x-text="socioEdicion.nombre || 'Nuevo Socio'"></span></span>
          <button @click="modalConfigAbierto = false" class="text-slate-400 hover:text-white text-sm">✕</button>
        </h2>

        <!-- CAMPOS BASE -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="text-[11px] font-semibold text-slate-400 uppercase">Nombre Socio</label>
            <input type="text" x-model="socioEdicion.nombre" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-400 uppercase">Moneda Nativa (Base)</label>
            <select x-model="socioEdicion.moneda_base" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-cyan-500">
              <option value="USDT">USDT (Tether)</option>
              <option value="PYUSD">PYUSD (PayPal USD)</option>
              <option value="USD">USD (Dólar USA)</option>
              <option disabled>──────────</option>
              <option value="ARS">ARS (Argentina)</option>
              <option value="BOB">BOB (Bolivia)</option>
              <option value="BRL">BRL (Brasil)</option>
              <option value="CAD">CAD (Canadá)</option>
              <option value="CLP">CLP (Chile)</option>
              <option value="COP">COP (Colombia)</option>
              <option value="CRC">CRC (Costa Rica)</option>
              <option value="DOP">DOP (Rep. Dominicana)</option>
              <option value="ECU">ECU (Ecuador)</option>
              <option value="EUR">EUR (Euro)</option>
              <option value="MXN">MXN (México)</option>
              <option value="PAN">PAN (Panamá)</option>
              <option value="PEN">PEN (Perú)</option>
              <option value="PYG">PYG (Paraguay)</option>
              <option value="VES">VES (Venezuela)</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-400 uppercase">Saldo Inicial Base</label>
            <input type="number" step="0.01" x-model="socioEdicion.saldo_inicial" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-white">
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-400 uppercase">¿Hereda Tasas?</label>
            <select x-model="socioEdicion.herencia" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-white">
              <option :value="false">NO</option>
              <option :value="true">SÍ</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[11px] font-semibold text-slate-400 uppercase">WhatsApp Remote JID / ID Grupo</label>
          <input type="text" x-model="socioEdicion.id_grupo" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm font-mono text-cyan-300">
        </div>

        <!-- REGLAS POR PAÍS (PORCENTAJES %) -->
        <div class="border-t border-slate-800 pt-5 space-y-4">
          
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <h3 class="text-xs font-bold text-slate-200 tracking-wider uppercase flex items-center gap-2">
              <span>Reglas por País (Porcentajes %)</span>
              <span class="text-[10px] px-2 py-0.5 rounded bg-purple-500/10 text-purple-300 border border-purple-500/20" x-text="`${reglasMonedas.length} activas`"></span>
            </h3>
            
            <!-- CONTROL: AGREGAR MONEDA -->
            <div class="flex items-center gap-2">
              <select 
                x-model="monedaParaAgregar" 
                class="bg-[#030611] border border-slate-700 text-xs rounded-lg px-3 py-1.5 text-slate-200 focus:outline-none focus:border-cyan-500">
                <option value="">Seleccionar país/moneda...</option>
                <template x-for="(meta, cod) in catalogoMonedas" :key="cod">
                  <option :value="cod" x-text="`${meta.iso} ${meta.nombre} (${cod})`" :disabled="tieneRegla(cod)"></option>
                </template>
              </select>

              <button 
                type="button" 
                @click="agregarReglaMoneda()" 
                :disabled="!monedaParaAgregar"
                class="px-3 py-1.5 rounded-lg border border-cyan-500/50 bg-cyan-500/10 text-cyan-400 text-xs font-bold hover:bg-cyan-500/20 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-1">
                + Agregar Moneda
              </button>
            </div>
          </div>

          <!-- GRID DE TARJETAS POR MONEDA -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 max-h-[380px] overflow-y-auto pr-1">
            <template x-for="(regla, index) in reglasMonedas" :key="regla.codigo">
              <div class="bg-[#050a1e] border border-purple-500/30 hover:border-purple-500/50 rounded-xl p-3.5 space-y-3 shadow-md transition">
                
                <!-- CABECERA DE LA TARJETA -->
                <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-mono font-bold text-cyan-400" x-text="regla.iso"></span>
                    <span class="text-sm font-bold text-white tracking-wide" x-text="`${regla.nombre} (${regla.codigo})`"></span>
                  </div>

                  <div class="flex items-center gap-3">
                    <div class="flex items-center gap-1.5">
                      <span class="text-[10px] text-slate-400 font-bold uppercase">DEF:</span>
                      <select x-model="regla.def" class="bg-[#030611] border border-slate-700 text-xs text-cyan-400 rounded px-2 py-0.5 font-bold focus:outline-none">
                        <option value="D">D (Depósito)</option>
                        <option value="P">P (Pago)</option>
                      </select>
                    </div>
                    
                    <button 
                      type="button" 
                      @click="eliminarReglaMoneda(index)" 
                      class="text-slate-400 hover:text-rose-400 text-sm transition p-1" 
                      title="Quitar país">
                      🗑
                    </button>
                  </div>
                </div>

                <!-- CONTENIDO: DEPÓSITO Y PAGO -->
                <div class="grid grid-cols-2 gap-3">
                  
                  <!-- BLOQUE: DEPÓSITO (D) -->
                  <div class="bg-[#030611] border border-cyan-950/80 rounded-lg p-2.5 space-y-1.5">
                    <div class="flex items-center justify-between">
                      <span class="text-[10px] font-bold text-cyan-400">DEPÓSITO (D) %</span>
                      <span class="text-[10px] font-mono text-slate-400" x-text="regla.base ? Number(regla.base).toLocaleString() : '-'"></span>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <input 
                        type="number" 
                        step="0.01" 
                        x-model="regla.deposito" 
                        class="w-full bg-[#070e23] border border-slate-800 rounded px-2 py-1 text-center font-bold text-xs text-white focus:outline-none focus:border-cyan-500">
                      <button 
                        type="button" 
                        @click="regla.dep_op = (regla.dep_op === '+' ? '-' : '+')"
                        :class="regla.dep_op === '+' ? 'border-emerald-500/40 bg-emerald-500/10 text-emerald-400' : 'border-rose-500/40 bg-rose-500/10 text-rose-400'"
                        class="px-2 py-1 rounded text-[11px] font-bold border shrink-0 transition"
                        x-text="regla.dep_op === '+' ? '+ Suma' : '- Resta'">
                      </button>
                    </div>
                  </div>

                  <!-- BLOQUE: PAGO (P) -->
                  <div class="bg-[#030611] border border-amber-950/80 rounded-lg p-2.5 space-y-1.5">
                    <div class="flex items-center justify-between">
                      <span class="text-[10px] font-bold text-amber-400">PAGO (P) %</span>
                      <span class="text-[10px] font-mono text-slate-400" x-text="regla.base ? Number(regla.base).toLocaleString() : '-'"></span>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <input 
                        type="number" 
                        step="0.01" 
                        x-model="regla.pago" 
                        class="w-full bg-[#070e23] border border-slate-800 rounded px-2 py-1 text-center font-bold text-xs text-white focus:outline-none focus:border-amber-500">
                      <button 
                        type="button" 
                        @click="regla.pago_op = (regla.pago_op === '-' ? '+' : '-')"
                        :class="regla.pago_op === '-' ? 'border-rose-500/40 bg-rose-500/10 text-rose-400' : 'border-emerald-500/40 bg-emerald-500/10 text-emerald-400'"
                        class="px-2 py-1 rounded text-[11px] font-bold border shrink-0 transition"
                        x-text="regla.pago_op === '-' ? '- Resta' : '+ Suma'">
                      </button>
                    </div>
                  </div>

                </div>

              </div>
            </template>
          </div>

          <div x-show="reglasMonedas.length === 0" class="text-center py-6 border border-dashed border-slate-800 rounded-xl text-slate-500 text-xs">
            Sin reglas individuales. El socio heredará las tasas generales o no tendrá márgenes configurados.
          </div>

        </div>

        <!-- FOOTER DEL MODAL -->
        <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-800">
          <button @click="modalConfigAbierto = false" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">
            Cancelar
          </button>
          <button @click="guardarSocio()" class="px-5 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold transition shadow-lg">
            💾 Guardar Cambios
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    function perfilHubApp() {
      return {
        socios: [],
        busqueda: '',
        modalConfigAbierto: false,
        socioEdicion: {},
        reglasMonedas: [],
        monedaParaAgregar: '',

        // Catálogo de las 17 entidades de TasasHub
        catalogoMonedas: {
          ARS: { nombre: 'Argentina', iso: 'AR', base: 1602 },
          VES: { nombre: 'Venezuela', iso: 'VE', base: 1000 },
          PEN: { nombre: 'Perú', iso: 'PE', base: 3.45 },
          COP: { nombre: 'Colombia', iso: 'CO', base: 3175 },
          CLP: { nombre: 'Chile', iso: 'CL', base: 988 },
          BRL: { nombre: 'Brasil', iso: 'BR', base: 5.05 },
          BOB: { nombre: 'Bolivia', iso: 'BO', base: 11.86 },
          USD: { nombre: 'Dólar USA', iso: 'US', base: 1 },
          USDT: { nombre: 'Tether USDT', iso: 'US', base: 1 },
          PYUSD: { nombre: 'PayPal USD', iso: 'US', base: 1.2 },
          EUR: { nombre: 'Euro', iso: 'EU', base: 0.9 },
          MXN: { nombre: 'México', iso: 'MX', base: 18.54 },
          CAD: { nombre: 'Canadá', iso: 'CA', base: 1.45 },
          CRC: { nombre: 'Costa Rica', iso: 'CR', base: 456 },
          DOP: { nombre: 'Rep. Dominicana', iso: 'DO', base: 62.09 },
          PYG: { nombre: 'Paraguay', iso: 'PY', base: 5781 },
          ECU: { nombre: 'Ecuador', iso: 'EC', base: 1 },
          PAN: { nombre: 'Panamá', iso: 'PA', base: 1 }
        },

        async init() {
          await this.cargarSocios();
        },

        async cargarSocios() {
          try {
            const res = await fetch('/api/v1/perfiles');
            if (res.ok) {
              this.socios = await res.json();
            }
          } catch (e) {
            console.error('Error cargando socios:', e);
          }
        },

        get sociosFiltrados() {
          if (!this.busqueda.trim()) return this.socios;
          const q = this.busqueda.toLowerCase();
          return this.socios.filter(s => 
            (s.nombre && s.nombre.toLowerCase().includes(q)) ||
            (s.id_grupo && s.id_grupo.toLowerCase().includes(q))
          );
        },

        tieneRegla(codigo) {
          return this.reglasMonedas.some(r => r.codigo === codigo);
        },

        agregarReglaMoneda() {
          if (!this.monedaParaAgregar || this.tieneRegla(this.monedaParaAgregar)) return;
          const meta = this.catalogoMonedas[this.monedaParaAgregar] || {};
          this.reglasMonedas.push({
            codigo: this.monedaParaAgregar,
            nombre: meta.nombre || this.monedaParaAgregar,
            iso: meta.iso || this.monedaParaAgregar.substring(0, 2),
            base: meta.base || '',
            def: 'D',
            deposito: 0,
            dep_op: '+',
            pago: 0,
            pago_op: '-'
          });
          this.monedaParaAgregar = '';
        },

        eliminarReglaMoneda(index) {
          this.reglasMonedas.splice(index, 1);
        },

        abrirConfiguracion(socio) {
          this.socioEdicion = JSON.parse(JSON.stringify(socio));
          this.reglasMonedas = [];

          let rawMonedas = socio.monedas;
          if (typeof rawMonedas === 'string') {
            try { rawMonedas = JSON.parse(rawMonedas); } catch (e) { rawMonedas = {}; }
          }
          rawMonedas = rawMonedas || {};

          for (const [cod, data] of Object.entries(rawMonedas)) {
            const meta = this.catalogoMonedas[cod] || {};
            this.reglasMonedas.push({
              codigo: cod,
              nombre: meta.nombre || cod,
              iso: meta.iso || cod.substring(0, 2),
              base: meta.base || '',
              def: data.def || 'D',
              deposito: data.deposito ?? data.deposito_pct ?? 0,
              dep_op: data.dep_op || data.deposito_op || '+',
              pago: data.pago ?? data.pago_pct ?? 0,
              pago_op: data.pago_op || data.pago_op || '-'
            });
          }

          this.modalConfigAbierto = true;
        },

        abrirNuevoSocio() {
          this.socioEdicion = {
            nombre: '',
            moneda_base: 'USDT',
            saldo_inicial: 0,
            herencia: false,
            id_grupo: '',
            mostrar: { tasas: true, dashboard: true }
          };
          this.reglasMonedas = [];
          this.modalConfigAbierto = true;
        },

        async guardarSocio() {
          if (!this.socioEdicion.nombre || !this.socioEdicion.nombre.trim()) {
            alert('El nombre del socio es obligatorio');
            return;
          }

          try {
            const monedasObj = {};
            this.reglasMonedas.forEach(r => {
              monedasObj[r.codigo] = {
                def: r.def,
                deposito: parseFloat(r.deposito) || 0,
                dep_op: r.dep_op,
                pago: parseFloat(r.pago) || 0,
                pago_op: r.pago_op
              };
            });

            const payload = {
              ...this.socioEdicion,
              monedas: monedasObj
            };

            const res = await fetch('/api/v1/perfiles/guardar', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (res.ok) {
              this.modalConfigAbierto = false;
              await this.cargarSocios();
            } else {
              const errData = await res.json().catch(() => ({}));
              alert(`Error al guardar: ${errData.error || 'Fallo en el servidor'}`);
            }
          } catch (e) {
            alert('Error de conexión al guardar socio');
          }
        },

        async toggleEstado(socio) {
          const nuevoEstado = !(socio.mostrar?.tasas);
          try {
            const res = await fetch(`/api/v1/perfiles/${encodeURIComponent(socio.nombre)}/estado`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ activo: nuevoEstado })
            });
            if (res.ok) {
              if (!socio.mostrar) socio.mostrar = {};
              socio.mostrar.tasas = nuevoEstado;
            }
          } catch (e) {
            alert('Error actualizando estado');
          }
        },

        async apagarTodos() {
          if (!confirm('¿Deseas apagar las tasas de todos los socios excepto GENERAL?')) return;
          try {
            const res = await fetch('/api/v1/perfiles/apagar-todos', { method: 'POST' });
            if (res.ok) await this.cargarSocios();
          } catch (e) {
            alert('Error al apagar todos');
          }
        },

        async guardarPlantilla() {
          try {
            const res = await fetch('/api/v1/perfiles/plantilla/memorizar', { method: 'POST' });
            const data = await res.json();
            alert(data.message || 'Plantilla memorizada');
          } catch (e) {
            alert('Error guardando plantilla');
          }
        },

        async restaurarPlantilla() {
          if (!confirm('¿Restaurar la última plantilla de socios activos?')) return;
          try {
            const res = await fetch('/api/v1/perfiles/plantilla/restaurar', { method: 'POST' });
            const data = await res.json();
            alert(data.message || 'Plantilla restaurada');
            await this.cargarSocios();
          } catch (e) {
            alert('Error restaurando plantilla');
          }
        },

        async eliminarSocio(socio) {
          if (!confirm(`¿Eliminar al socio ${socio.nombre}?`)) return;
          try {
            const res = await fetch(`/api/v1/perfiles/${encodeURIComponent(socio.nombre)}`, {
              method: 'DELETE'
            });
            if (res.ok) await this.cargarSocios();
          } catch (e) {
            alert('Error al eliminar socio');
          }
        }
      };
    }
  </script>
</body>
</html>
